version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dashboard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dashboard_secret}
      POSTGRES_DB: ${DB_NAME:-dashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dashboard} -d ${DB_NAME:-dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard-network

  # NestJS API Backend
  dashboard-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: dashboard-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-dashboard}:${DB_PASSWORD:-dashboard_secret}@postgres:5432/${DB_NAME:-dashboard}
      
      # JWT Secret (CHANGE IN PRODUCTION!)
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-to-a-long-random-string}
      
      # API Configuration
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-production}
      
      # CORS - Allow frontend origin
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      
      # Frontend URL for SSO callback redirect
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      
      # API Base URL (for SSO callback)
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dashboard-network

  # Next.js Frontend UI
  dashboard-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        # These are baked into the build
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_ICON_SOURCE: ${NEXT_PUBLIC_ICON_SOURCE:-https://cdn.jsdelivr.net/gh/selfhst/icons/png/}
    container_name: dashboard-ui
    restart: unless-stopped
    depends_on:
      dashboard-api:
        condition: service_healthy
    environment:
      # Runtime config (for server-side fetching)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      NEXT_PUBLIC_ICON_SOURCE: ${NEXT_PUBLIC_ICON_SOURCE:-https://cdn.jsdelivr.net/gh/selfhst/icons/png/}
    ports:
      - "${UI_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dashboard-network

volumes:
  postgres_data:
    driver: local

networks:
  dashboard-network:
    driver: bridge
